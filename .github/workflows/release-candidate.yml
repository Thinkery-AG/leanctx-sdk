name: SDK release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - v1.1.0

permissions:
  contents: read

concurrency:
  group: sdk-v1-rc-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_COMMIT: 5b6920216177b01f48694efff1d6be9505665263
  ENGINE_VERSION: 3.10.0
  ENGINE_TAG: v3.10.0
  ENGINE_RELEASE_REPOSITORY: yvgude/lean-ctx
  ENGINE_RELEASE_URL: https://github.com/yvgude/lean-ctx/releases/tag/v3.10.0
  ENGINE_RELEASE_DOWNLOAD_URL: https://github.com/yvgude/lean-ctx/releases/download/v3.10.0
  ENGINE_LINUX_ASSET: lean-ctx-x86_64-unknown-linux-gnu.tar.gz
  ENGINE_MACOS_ASSET: lean-ctx-aarch64-apple-darwin.tar.gz
  ENGINE_LINUX_ARCHIVE_SHA256: f5ad20cbf3eba9ff3024348cc0abe71199f47ae0e13d5554bfeb6345154928e0
  ENGINE_MACOS_ARCHIVE_SHA256: ecd773971d118a19a3de723e82d9f0831c8e1543094d350b3861bcaa75dc6035
  ENGINE_CHECKSUMS_SHA256: 0fab38178ac0cbb4b1f807c602f77bc738082672f627fe02448b8be8e7f5d8e4
  ENGINE_LINUX_X86_64_SHA256: 735f60243cf4030ee6bbb292f06fb23742483fd4c857aac91e02914b3a80ac03
  ENGINE_MACOS_ARM64_SHA256: 8f7787ccc6376f1d34b8d342fbc916bd082673e6797ea384e6e10edc3641b4eb
  ENGINE_COSIGN_IDENTITY: https://github.com/yvgude/lean-ctx/.github/workflows/release.yml@refs/tags/v3.10.0
  ENGINE_COSIGN_ISSUER: https://token.actions.githubusercontent.com
  SOURCE_DATE_EPOCH: "1704067200"

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v 2>&1 | tee source-contract.log
      - run: python -m compileall -q src tests scripts examples benchmarks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-contract-py${{ matrix.python }}-${{ github.sha }}
          path: source-contract.log
          if-no-files-found: error
          retention-days: 14

  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lock_sha256: ${{ steps.lock.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: lock
        run: echo "sha256=$(sha256sum requirements/release-quality.txt | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements/release-quality.txt
      - run: ruff --version | tee static-quality.log
      - run: mypy --version | tee -a static-quality.log
      - run: ty --version | tee -a static-quality.log
      - run: ruff check src tests scripts examples benchmarks 2>&1 | tee -a static-quality.log
      - run: ruff format --check src tests scripts examples benchmarks 2>&1 | tee -a static-quality.log
      - run: >-
          ty check --exclude 'src/leanctx_sdk/integrations/**'
          src/leanctx_sdk
          2>&1 | tee -a static-quality.log
      - run: >-
          MYPYPATH=src mypy --ignore-missing-imports
          src/leanctx_sdk
          benchmarks/agent_tools
          scripts/verify_agent_context_e2e.py
          2>&1 | tee -a static-quality.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-quality-${{ github.sha }}
          path: static-quality.log
          if-no-files-found: error
          retention-days: 14

  source-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/source_secret_scan.py --repository . > source-secret-scan.json
      - run: python scripts/public_release_guard.py --repository . > public-release-guard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-secret-scan-${{ github.sha }}
          path: |
            source-secret-scan.json
            public-release-guard.json
          if-no-files-found: error
          retention-days: 14

  engine-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: |
          test "$(git ls-remote "https://github.com/$ENGINE_RELEASE_REPOSITORY.git" "refs/tags/$ENGINE_TAG^{}" | awk '{print $1}')" = "$ENGINE_COMMIT"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/$ENGINE_LINUX_ASSET"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/SHA256SUMS"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/SHA256SUMS.sig"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/SHA256SUMS.pem"
          test "$(sha256sum SHA256SUMS | cut -d ' ' -f1)" = "$ENGINE_CHECKSUMS_SHA256"
          cosign verify-blob \
            --certificate SHA256SUMS.pem \
            --signature SHA256SUMS.sig \
            --certificate-identity "$ENGINE_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$ENGINE_COSIGN_ISSUER" \
            SHA256SUMS
          test "$(sha256sum "$ENGINE_LINUX_ASSET" | cut -d ' ' -f1)" = "$ENGINE_LINUX_ARCHIVE_SHA256"
          grep -Fx "$ENGINE_LINUX_ARCHIVE_SHA256  $ENGINE_LINUX_ASSET" SHA256SUMS
          test "$(tar -tzf "$ENGINE_LINUX_ASSET")" = lean-ctx
          test "$(tar -tvzf "$ENGINE_LINUX_ASSET" | cut -c1)" = -
          mkdir engine-artifact
          tar -xzf "$ENGINE_LINUX_ASSET" -C engine-artifact
          chmod 0755 engine-artifact/lean-ctx
      - run: test "$(engine-artifact/lean-ctx --version | awk '{print $2}')" = "$ENGINE_VERSION"
      - id: digest
        run: echo "sha256=$(sha256sum engine-artifact/lean-ctx | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: test "${{ steps.digest.outputs.sha256 }}" = "$ENGINE_LINUX_X86_64_SHA256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-linux-x86_64-${{ env.ENGINE_COMMIT }}
          path: engine-artifact/lean-ctx
          if-no-files-found: error
          retention-days: 14

  engine-macos-artifact:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: test "$(uname -m)" = arm64
      - run: |
          test "$(git ls-remote "https://github.com/$ENGINE_RELEASE_REPOSITORY.git" "refs/tags/$ENGINE_TAG^{}" | awk '{print $1}')" = "$ENGINE_COMMIT"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/$ENGINE_MACOS_ASSET"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/SHA256SUMS"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/SHA256SUMS.sig"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --remote-name "$ENGINE_RELEASE_DOWNLOAD_URL/SHA256SUMS.pem"
          test "$(shasum -a 256 SHA256SUMS | cut -d ' ' -f1)" = "$ENGINE_CHECKSUMS_SHA256"
          cosign verify-blob \
            --certificate SHA256SUMS.pem \
            --signature SHA256SUMS.sig \
            --certificate-identity "$ENGINE_COSIGN_IDENTITY" \
            --certificate-oidc-issuer "$ENGINE_COSIGN_ISSUER" \
            SHA256SUMS
          test "$(shasum -a 256 "$ENGINE_MACOS_ASSET" | cut -d ' ' -f1)" = "$ENGINE_MACOS_ARCHIVE_SHA256"
          grep -Fx "$ENGINE_MACOS_ARCHIVE_SHA256  $ENGINE_MACOS_ASSET" SHA256SUMS
          test "$(tar -tzf "$ENGINE_MACOS_ASSET")" = lean-ctx
          test "$(tar -tvzf "$ENGINE_MACOS_ASSET" | cut -c1)" = -
          mkdir engine-artifact
          tar -xzf "$ENGINE_MACOS_ASSET" -C engine-artifact
          chmod 0755 engine-artifact/lean-ctx
      - run: test "$(engine-artifact/lean-ctx --version | awk '{print $2}')" = "$ENGINE_VERSION"
      - id: digest
        run: echo "sha256=$(shasum -a 256 engine-artifact/lean-ctx | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: test "${{ steps.digest.outputs.sha256 }}" = "$ENGINE_MACOS_ARM64_SHA256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-macos-arm64-${{ env.ENGINE_COMMIT }}
          path: engine-artifact/lean-ctx
          if-no-files-found: error
          retention-days: 14

  sdk-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_lock_sha256: ${{ steps.build-lock.outputs.sha256 }}
      sdk_commit: ${{ steps.source.outputs.commit }}
      wheel_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: test -z "$(git status --porcelain=v1)"
      - id: build-lock
        run: echo "sha256=$(sha256sum requirements/release-build.txt | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: python -m venv "$RUNNER_TEMP/build-venv"
      - run: >-
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install
          --require-hashes --no-deps --only-binary=:all:
          --requirement requirements/release-build.txt
      - run: >-
          "$RUNNER_TEMP/build-venv/bin/python" -m pip freeze --all
          > dist-build-tools.txt
      - run: >-
          "$RUNNER_TEMP/build-venv/bin/python" -m pip wheel
          --no-deps --no-build-isolation --wheel-dir dist .
      - run: python scripts/inspect_release_artifact.py dist/*.whl > dist/package-inspection.json
      - id: digest
        run: echo "sha256=$(sha256sum dist/*.whl | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: sha256sum dist/*.whl > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-wheel-${{ steps.source.outputs.commit }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-build-tools-${{ steps.source.outputs.commit }}
          path: dist-build-tools.txt
          if-no-files-found: error
          retention-days: 14

  installed-engine-contract:
    needs: [engine-artifact, sdk-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: echo "ENGINE_BIN=$RUNNER_TEMP/engine-artifact/lean-ctx" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-linux-x86_64-${{ env.ENGINE_COMMIT }}
          path: ${{ runner.temp }}/engine-artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-wheel-${{ needs.sdk-artifact.outputs.sdk_commit }}
          path: dist
      - run: chmod 0755 "$ENGINE_BIN"
      - run: test "$(sha256sum "$ENGINE_BIN" | cut -d ' ' -f1)" = "${{ needs.engine-artifact.outputs.sha256 }}"
      - run: test "$(sha256sum dist/*.whl | cut -d ' ' -f1)" = "${{ needs.sdk-artifact.outputs.wheel_sha256 }}"
      - run: >-
          python scripts/verify_wheel_install.py
          --wheel "$(realpath dist/*.whl)"
          --engine "$ENGINE_BIN"
          --expected-engine-sha256 "${{ needs.engine-artifact.outputs.sha256 }}"
          --expected-wheel-sha256 "${{ needs.sdk-artifact.outputs.wheel_sha256 }}"
          --expected-sdk-commit "${{ needs.sdk-artifact.outputs.sdk_commit }}"
          2>&1 | tee installed-engine-contract.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-engine-contract-py${{ matrix.python }}-${{ needs.sdk-artifact.outputs.sdk_commit }}
          path: installed-engine-contract.log
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
      policy_sha256: ${{ steps.policy.outputs.sha256 }}
      tool_lock_sha256: ${{ steps.tool-lock.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: manifest
        run: echo "sha256=$(sha256sum fixtures/openai-agents-0.8.4/wheelhouse-manifest.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: policy
        run: echo "sha256=$(sha256sum fixtures/openai-agents-0.8.4/dependency-audit-policy.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: tool-lock
        run: echo "sha256=$(sha256sum requirements/release-audit.txt | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: >-
          python -m scripts.manifest_requirements
          --manifest fixtures/openai-agents-0.8.4/wheelhouse-manifest.json
          > "$RUNNER_TEMP/sdk-v1-requirements.txt"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements/release-audit.txt
      - run: pip-audit --version > "$RUNNER_TEMP/dependency-audit-tools.txt"
      - run: >-
          pip-audit --require-hashes --disable-pip --progress-spinner off
          --format json --output "$RUNNER_TEMP/pip-audit.json"
          --requirement "$RUNNER_TEMP/sdk-v1-requirements.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dependency-audit-tools.txt
            ${{ runner.temp }}/pip-audit.json
            ${{ runner.temp }}/sdk-v1-requirements.txt
          if-no-files-found: error
          retention-days: 14

  framework-offline:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [engine-macos-artifact, sdk-artifact]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: echo "WHEELHOUSE=$RUNNER_TEMP/wheelhouse" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-wheel-${{ needs.sdk-artifact.outputs.sdk_commit }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-macos-arm64-${{ env.ENGINE_COMMIT }}
          path: ${{ runner.temp }}/engine-artifact
      - run: test "$(shasum -a 256 dist/*.whl | cut -d ' ' -f1)" = "${{ needs.sdk-artifact.outputs.wheel_sha256 }}"
      - run: >-
          test "$(shasum -a 256 "$RUNNER_TEMP/engine-artifact/lean-ctx" | cut -d ' ' -f1)"
          = "${{ needs.engine-macos-artifact.outputs.sha256 }}"
      - run: chmod 0755 "$RUNNER_TEMP/engine-artifact/lean-ctx"
      - run: test "$(uname -m)" = arm64
      - run: >-
          python -m scripts.manifest_requirements
          --manifest fixtures/openai-agents-0.8.4/wheelhouse-manifest.json
          > "$RUNNER_TEMP/sdk-v1-requirements.txt"
      - run: mkdir -p "$WHEELHOUSE"
      - run: >-
          python -m pip download --require-hashes --only-binary=:all:
          --dest "$WHEELHOUSE"
          --requirement "$RUNNER_TEMP/sdk-v1-requirements.txt"
      - run: >-
          python scripts/validate_wheelhouse.py
          --manifest fixtures/openai-agents-0.8.4/wheelhouse-manifest.json
          --wheelhouse "$WHEELHOUSE"
      - run: >-
          python -m scripts.dependency_wheel_audit
          --manifest fixtures/openai-agents-0.8.4/wheelhouse-manifest.json
          --policy fixtures/openai-agents-0.8.4/dependency-audit-policy.json
          --wheelhouse "$WHEELHOUSE"
          > "$RUNNER_TEMP/dependency-wheel-audit.json"
      - run: python -m venv "$RUNNER_TEMP/framework-venv"
      - run: >-
          "$RUNNER_TEMP/framework-venv/bin/python" -m pip --isolated install
          --no-index --find-links "$WHEELHOUSE"
          "$(realpath dist/*.whl)[openai-agents]"
      - run: >-
          "$RUNNER_TEMP/framework-venv/bin/python" -m pip check
      - run: >-
          "$RUNNER_TEMP/framework-venv/bin/python" -c
          "from importlib.metadata import version; from agents import Runner;
          assert version('openai-agents') == '0.8.4'; assert Runner is not None"
      - run: >-
          "$RUNNER_TEMP/framework-venv/bin/python"
          scripts/verify_openai_agents_runtime.py
          --engine "$RUNNER_TEMP/engine-artifact/lean-ctx"
          > "$RUNNER_TEMP/framework-behavior.json"
      - run: >-
          "$RUNNER_TEMP/framework-venv/bin/python"
          scripts/verify_agent_context_e2e.py
          --engine "$RUNNER_TEMP/engine-artifact/lean-ctx"
          --expected-engine-version 3.10.1
          > "$RUNNER_TEMP/agent-context-e2e.json"
      - run: >-
          "$RUNNER_TEMP/framework-venv/bin/python"
          -m benchmarks.agent_tools.retrieval_benchmark
          --engine "$RUNNER_TEMP/engine-artifact/lean-ctx"
          --output "$RUNNER_TEMP/agent-tools-benchmark.json"
      - run: >-
          "$RUNNER_TEMP/framework-venv/bin/python" -m pip freeze --all
          > "$RUNNER_TEMP/framework-installed.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framework-offline-${{ needs.sdk-artifact.outputs.sdk_commit }}
          path: |
            ${{ runner.temp }}/dependency-wheel-audit.json
            ${{ runner.temp }}/agent-context-e2e.json
            ${{ runner.temp }}/agent-tools-benchmark.json
            ${{ runner.temp }}/framework-behavior.json
            ${{ runner.temp }}/framework-installed.txt
          if-no-files-found: error
          retention-days: 14

  provenance:
    if: >-
      ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
      needs.source-contract.result == 'success' &&
      needs.static-quality.result == 'success' &&
      needs.source-secret-scan.result == 'success' &&
      needs.engine-artifact.result == 'success' &&
      needs.engine-macos-artifact.result == 'success' &&
      needs.sdk-artifact.result == 'success' &&
      needs.installed-engine-contract.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.publication-guard.result == 'success' &&
      needs.framework-offline.result == 'success' }}
    needs:
      - source-contract
      - static-quality
      - source-secret-scan
      - engine-artifact
      - engine-macos-artifact
      - sdk-artifact
      - installed-engine-contract
      - dependency-audit
      - framework-offline
      - publication-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SDK_COMMIT: ${{ needs.sdk-artifact.outputs.sdk_commit }}
      SDK_VERSION: 1.1.0
      SDK_WHEEL_SHA256: ${{ needs.sdk-artifact.outputs.wheel_sha256 }}
      ENGINE_LINUX_X86_64_SHA256: ${{ needs.engine-artifact.outputs.sha256 }}
      ENGINE_MACOS_ARM64_SHA256: ${{ needs.engine-macos-artifact.outputs.sha256 }}
      ENGINE_RELEASE_REPOSITORY: yvgude/lean-ctx
      ENGINE_RELEASE_URL: https://github.com/yvgude/lean-ctx/releases/tag/v3.10.0
      ENGINE_LINUX_ASSET: lean-ctx-x86_64-unknown-linux-gnu.tar.gz
      ENGINE_MACOS_ASSET: lean-ctx-aarch64-apple-darwin.tar.gz
      ENGINE_LINUX_ARCHIVE_SHA256: f5ad20cbf3eba9ff3024348cc0abe71199f47ae0e13d5554bfeb6345154928e0
      ENGINE_MACOS_ARCHIVE_SHA256: ecd773971d118a19a3de723e82d9f0831c8e1543094d350b3861bcaa75dc6035
      ENGINE_CHECKSUMS_SHA256: 0fab38178ac0cbb4b1f807c602f77bc738082672f627fe02448b8be8e7f5d8e4
      ENGINE_COSIGN_IDENTITY: https://github.com/yvgude/lean-ctx/.github/workflows/release.yml@refs/tags/v3.10.0
      DEPENDENCY_MANIFEST_SHA256: ${{ needs.dependency-audit.outputs.manifest_sha256 }}
      DEPENDENCY_POLICY_SHA256: ${{ needs.dependency-audit.outputs.policy_sha256 }}
      AUDIT_TOOL_LOCK_SHA256: ${{ needs.dependency-audit.outputs.tool_lock_sha256 }}
      BUILD_TOOL_LOCK_SHA256: ${{ needs.sdk-artifact.outputs.build_lock_sha256 }}
      QUALITY_TOOL_LOCK_SHA256: ${{ needs.static-quality.outputs.lock_sha256 }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      SIGNING_PROVENANCE: GITHUB_OIDC_TRUSTED_PUBLISHING
      PUBLIC_REPOSITORY: ${{ github.repository }}
      PYPI_PROJECT: thinkery-leanctx-sdk
      PUBLICATION_AUTHORIZATION: ${{ vars.SDK_V1_PUBLICATION_AUTHORIZED }}
      FRAMEWORK_GATE: ${{ needs.framework-offline.result }}
      FRAMEWORK_VERSION: openai-agents==0.8.4
      PYTHON_MATRIX: 3.9,3.10,3.11,3.12,3.13,3.14
      EVIDENCE_DIR: release-evidence/sdk-v1/${{ needs.sdk-artifact.outputs.sdk_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*"
          path: ${{ env.EVIDENCE_DIR }}/artifacts
      - run: >-
          python scripts/create_release_evidence.py
          --output-dir "$EVIDENCE_DIR"
          --sdk-commit "$SDK_COMMIT"
          --sdk-version "$SDK_VERSION"
          --wheel-sha256 "$SDK_WHEEL_SHA256"
          --engine-commit "$ENGINE_COMMIT"
          --engine-version "$ENGINE_VERSION"
          --engine-tag "$ENGINE_TAG"
          --engine-linux-sha256 "$ENGINE_LINUX_X86_64_SHA256"
          --engine-macos-sha256 "$ENGINE_MACOS_ARM64_SHA256"
          --engine-release-repository "$ENGINE_RELEASE_REPOSITORY"
          --engine-release-url "$ENGINE_RELEASE_URL"
          --engine-linux-asset "$ENGINE_LINUX_ASSET"
          --engine-macos-asset "$ENGINE_MACOS_ASSET"
          --engine-linux-archive-sha256 "$ENGINE_LINUX_ARCHIVE_SHA256"
          --engine-macos-archive-sha256 "$ENGINE_MACOS_ARCHIVE_SHA256"
          --engine-checksums-sha256 "$ENGINE_CHECKSUMS_SHA256"
          --engine-cosign-identity "$ENGINE_COSIGN_IDENTITY"
          --dependency-manifest-sha256 "$DEPENDENCY_MANIFEST_SHA256"
          --dependency-policy-sha256 "$DEPENDENCY_POLICY_SHA256"
          --build-lock-sha256 "$BUILD_TOOL_LOCK_SHA256"
          --quality-lock-sha256 "$QUALITY_TOOL_LOCK_SHA256"
          --audit-lock-sha256 "$AUDIT_TOOL_LOCK_SHA256"
          --python-matrix "$PYTHON_MATRIX"
          --verified-python-matrix "$PYTHON_MATRIX"
          --framework-version "$FRAMEWORK_VERSION"
          --release-workflow "$WORKFLOW_REF"
          --release-run "$WORKFLOW_RUN_ID"
          --signing-provenance "$SIGNING_PROVENANCE"
          --license-sha256 "$(sha256sum LICENSE | cut -d ' ' -f1)"
          --public-repository "$PUBLIC_REPOSITORY"
          --pypi-project "$PYPI_PROJECT"
          --publication-authorization "$PUBLICATION_AUTHORIZATION"
      - run: >-
          find "$EVIDENCE_DIR" -type f
          ! -name provenance.json ! -name PAYLOAD-SHA256SUMS
          ! -name SHA256SUMS ! -name EVIDENCE-BUNDLE-SHA256
          -print0 | sort -z | xargs -0 sha256sum
          > "$EVIDENCE_DIR/PAYLOAD-SHA256SUMS"
      - run: >-
          echo "EVIDENCE_PAYLOAD_SHA256=$(sha256sum "$EVIDENCE_DIR/PAYLOAD-SHA256SUMS" | cut -d ' ' -f1)"
          >> "$GITHUB_ENV"
      - run: >-
          python -c "import json, os;
          print(json.dumps({
          'dependency_manifest_sha256': os.environ['DEPENDENCY_MANIFEST_SHA256'],
          'dependency_policy_sha256': os.environ['DEPENDENCY_POLICY_SHA256'],
          'audit_tool_lock_sha256': os.environ['AUDIT_TOOL_LOCK_SHA256'],
          'build_tool_lock_sha256': os.environ['BUILD_TOOL_LOCK_SHA256'],
          'engine_commit': os.environ['ENGINE_COMMIT'],
          'engine_sha256': {
          'linux_x86_64': os.environ['ENGINE_LINUX_X86_64_SHA256'],
          'macos_arm64': os.environ['ENGINE_MACOS_ARM64_SHA256']},
          'engine_release': {
          'repository': os.environ['ENGINE_RELEASE_REPOSITORY'],
          'url': os.environ['ENGINE_RELEASE_URL'],
          'linux_asset': os.environ['ENGINE_LINUX_ASSET'],
          'macos_asset': os.environ['ENGINE_MACOS_ASSET'],
          'linux_archive_sha256': os.environ['ENGINE_LINUX_ARCHIVE_SHA256'],
          'macos_archive_sha256': os.environ['ENGINE_MACOS_ARCHIVE_SHA256'],
          'checksums_sha256': os.environ['ENGINE_CHECKSUMS_SHA256'],
          'cosign_identity': os.environ['ENGINE_COSIGN_IDENTITY']},
          'evidence_payload_sha256': os.environ['EVIDENCE_PAYLOAD_SHA256'],
          'framework_version': os.environ['FRAMEWORK_VERSION'],
          'framework_gate': os.environ['FRAMEWORK_GATE'],
          'gates': ['source-contract', 'static-quality', 'source-secret-scan', 'engine-artifact',
          'sdk-artifact', 'installed-engine-contract', 'dependency-audit',
          'framework-offline', 'publication-guard'],
          'sdk_commit': os.environ['SDK_COMMIT'],
          'sdk_version': os.environ['SDK_VERSION'],
          'sdk_wheel_sha256': os.environ['SDK_WHEEL_SHA256'],
          'sdk_wheel_python': '3.11',
          'python_matrix': os.environ['PYTHON_MATRIX'].split(','),
          'quality_tool_lock_sha256': os.environ['QUALITY_TOOL_LOCK_SHA256'],
          'signing_provenance': os.environ['SIGNING_PROVENANCE'],
          'workflow_ref': os.environ['WORKFLOW_REF'],
          'workflow_run_id': os.environ['WORKFLOW_RUN_ID']
          }, sort_keys=True))" > "$EVIDENCE_DIR/provenance.json"
      - run: >-
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS -print0 | sort -z |
          xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS"
      - run: sha256sum "$EVIDENCE_DIR/SHA256SUMS" > "$EVIDENCE_DIR/EVIDENCE-BUNDLE-SHA256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-${{ needs.sdk-artifact.outputs.sdk_commit }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14

  publication-guard:
    needs: sdk-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SDK_V1_PUBLICATION_AUTHORIZED: ${{ vars.SDK_V1_PUBLICATION_AUTHORIZED }}
      SDK_V1_APPROVED_SDK_COMMIT: ${{ vars.SDK_V1_APPROVED_SDK_COMMIT }}
      SDK_V1_APPROVED_VERSION: ${{ vars.SDK_V1_APPROVED_VERSION }}
      SDK_V1_APPROVED_WHEEL_SHA256: ${{ vars.SDK_V1_APPROVED_WHEEL_SHA256 }}
      SDK_V1_APPROVED_LICENSE_SHA256: ${{ vars.SDK_V1_APPROVED_LICENSE_SHA256 }}
      SDK_V1_APPROVED_REPOSITORY: ${{ vars.SDK_V1_APPROVED_REPOSITORY }}
      SDK_V1_APPROVED_PYPI_PROJECT: ${{ vars.SDK_V1_APPROVED_PYPI_PROJECT }}
      SDK_V1_APPROVED_ENGINE_COMMIT: ${{ vars.SDK_V1_APPROVED_ENGINE_COMMIT }}
      SDK_V1_APPROVED_ENGINE_VERSION: ${{ vars.SDK_V1_APPROVED_ENGINE_VERSION }}
      SDK_V1_APPROVED_ENGINE_TAG: ${{ vars.SDK_V1_APPROVED_ENGINE_TAG }}
      SDK_V1_APPROVED_ENGINE_LINUX_ARCHIVE_SHA256: ${{ vars.SDK_V1_APPROVED_ENGINE_LINUX_ARCHIVE_SHA256 }}
      SDK_V1_APPROVED_ENGINE_MACOS_ARCHIVE_SHA256: ${{ vars.SDK_V1_APPROVED_ENGINE_MACOS_ARCHIVE_SHA256 }}
      SDK_V1_APPROVED_ENGINE_CHECKSUMS_SHA256: ${{ vars.SDK_V1_APPROVED_ENGINE_CHECKSUMS_SHA256 }}
      SDK_V1_APPROVED_ENGINE_COSIGN_IDENTITY: ${{ vars.SDK_V1_APPROVED_ENGINE_COSIGN_IDENTITY }}
      SDK_WHEEL_SHA256: ${{ needs.sdk-artifact.outputs.wheel_sha256 }}
    steps:
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF" = refs/tags/v1.1.0
      - if: github.event_name != 'pull_request'
        run: |
          test "$SDK_V1_PUBLICATION_AUTHORIZED" = APPROVED
          test "$GITHUB_SHA" = "$SDK_V1_APPROVED_SDK_COMMIT"
          test "$SDK_V1_APPROVED_VERSION" = 1.1.0
          test "$SDK_WHEEL_SHA256" = "$SDK_V1_APPROVED_WHEEL_SHA256"
          test "$(sha256sum LICENSE | cut -d ' ' -f1)" = "$SDK_V1_APPROVED_LICENSE_SHA256"
          test "$GITHUB_REPOSITORY" = "$SDK_V1_APPROVED_REPOSITORY"
          test "$SDK_V1_APPROVED_PYPI_PROJECT" = thinkery-leanctx-sdk
          test "$ENGINE_COMMIT" = "$SDK_V1_APPROVED_ENGINE_COMMIT"
          test "$ENGINE_VERSION" = "$SDK_V1_APPROVED_ENGINE_VERSION"
          test "$ENGINE_TAG" = "$SDK_V1_APPROVED_ENGINE_TAG"
          test "$ENGINE_LINUX_ARCHIVE_SHA256" = "$SDK_V1_APPROVED_ENGINE_LINUX_ARCHIVE_SHA256"
          test "$ENGINE_MACOS_ARCHIVE_SHA256" = "$SDK_V1_APPROVED_ENGINE_MACOS_ARCHIVE_SHA256"
          test "$ENGINE_CHECKSUMS_SHA256" = "$SDK_V1_APPROVED_ENGINE_CHECKSUMS_SHA256"
          test "$ENGINE_COSIGN_IDENTITY" = "$SDK_V1_APPROVED_ENGINE_COSIGN_IDENTITY"
          test "$ENGINE_VERSION" = 3.10.0
          test "$ENGINE_TAG" = v3.10.0
      - if: github.event_name == 'pull_request'
        run: echo "Validation run; no publication requested."

  technical-release-gate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "SDK v1 technical release gates passed."

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - provenance
      - publication-guard
      - sdk-artifact
      - technical-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/thinkery-leanctx-sdk/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-wheel-${{ needs.sdk-artifact.outputs.sdk_commit }}
          path: download
      - env:
          APPROVED_SHA256: ${{ vars.SDK_V1_APPROVED_WHEEL_SHA256 }}
          BUILT_SHA256: ${{ needs.sdk-artifact.outputs.wheel_sha256 }}
        run: |
          test "$BUILT_SHA256" = "$APPROVED_SHA256"
          test "$(sha256sum download/thinkery_leanctx_sdk-1.1.0-py3-none-any.whl | cut -d ' ' -f1)" = "$APPROVED_SHA256"
          mkdir publish
          cp download/thinkery_leanctx_sdk-1.1.0-py3-none-any.whl publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish
          print-hash: true

  pull-request-validation:
    if: github.event_name == 'pull_request'
    needs:
      - source-contract
      - static-quality
      - source-secret-scan
      - engine-artifact
      - sdk-artifact
      - installed-engine-contract
      - dependency-audit
      - publication-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "PR validation passed; manual offline release gates were not executed."
