[package]
name = "thinkery-leanctx-sdk"
version = "1.2.0"
edition = "2021"
rust-version = "1.77"
description = "SDK for embedding LeanCTX context control in Rust applications"
license-file = "LICENSE"
repository = "https://github.com/thinkery-ag/leanctx-sdk"
readme = "README.md"
keywords = ["leanctx", "sdk", "agent-tools"]
categories = ["api-bindings", "development-tools"]

[lib]
name = "leanctx_sdk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
url = "=2.5.4"
# Keep url/rustls semver transitives within the crate's declared Rust 1.76 MSRV:
# newer idna_adapter pulls ICU 2.x, litemap 0.7.5 needs Rust 1.81, and zeroize
# 1.9 uses edition 2024, which Cargo 1.76 cannot parse.
idna_adapter = "=1.2.0"
litemap = "=0.7.4"
zeroize = "=1.8.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
