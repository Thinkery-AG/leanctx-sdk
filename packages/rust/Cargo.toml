[package]
name = "thinkery-leanctx-sdk"
version = "1.1.0"
edition = "2021"
rust-version = "1.76"
description = "Source-available Rust SDK for governed LeanCTX context and Agent Tools"
license-file = "LICENSE"
repository = "https://github.com/thinkery-ag/leanctx-sdk"
readme = "README.md"
publish = false
keywords = ["leanctx", "sdk", "agent-tools"]
categories = ["api-bindings", "development-tools"]

[lib]
name = "leanctx_sdk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
