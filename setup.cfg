[metadata]
name = thinkery-leanctx-sdk
version = 1.1.0
description = The Context SDK for AI Agents
long_description = file: README.md
long_description_content_type = text/markdown
author = Thinkery AG
license = Other/Proprietary License
url = https://github.com/Thinkery-AG/leanctx-sdk
project_urls =
    Documentation = https://github.com/Thinkery-AG/leanctx-sdk#readme
    Source = https://github.com/Thinkery-AG/leanctx-sdk
    Issues = https://github.com/Thinkery-AG/leanctx-sdk/issues
license_files =
    LICENSE
    COMMERCIAL-LICENSE.md
    THIRD_PARTY_NOTICES
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Typing :: Typed

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9,<3.13
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
leanctx_sdk = py.typed

[options.extras_require]
agent =
    thinkery-leanctx-engine==3.11.0
agent-cuda =
    thinkery-leanctx-engine-cuda==3.11.0; platform_system == "Linux" and platform_machine == "x86_64"
agent-windows-gnu =
    thinkery-leanctx-engine-windows-gnu==3.11.0; platform_system == "Windows" and platform_machine == "AMD64"
openai-agents =
    openai-agents==0.8.4; python_version >= "3.10"
    openai==2.19.0; python_version >= "3.10"
    pydantic==2.12.3; python_version >= "3.10"
    requests==2.33.0; python_version >= "3.10"
    urllib3==2.7.0; python_version >= "3.10"
